<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title description">
  <title id="title">Full-stack product architecture with an AI layer</title>
  <desc id="description">An AI layer powers three connected parts of a product: Frontend, Backend, and Data and Infrastructure.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4f46e5"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .eyebrow { font: 700 12px Arial, sans-serif; letter-spacing: 2px; fill: #93c5fd; }
      .title { font: 700 24px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #cbd5e1; }
      .card-title { font: 700 19px Arial, sans-serif; fill: #f8fafc; }
      .tech { font: 700 13px Arial, sans-serif; fill: #bae6fd; }
      .detail { font: 400 12px Arial, sans-serif; fill: #94a3b8; }
      .ai-title { font: 800 16px Arial, sans-serif; letter-spacing: 1px; fill: #ffffff; }
      .ai-text { font: 500 13px Arial, sans-serif; fill: #ede9fe; }
    </style>
  </defs>
  <rect width="960" height="410" rx="22" fill="url(#background)"/>
  <text x="48" y="43" class="eyebrow">FULL-STACK + AI</text>
  <text x="48" y="75" class="title">One product, four connected layers</text>
  <text x="48" y="99" class="subtitle">Build the core system first. Add AI where it makes the workflow more useful.</text>

  <g transform="translate(48 127)">
    <rect width="864" height="76" rx="16" fill="url(#ai)"/>
    <circle cx="42" cy="38" r="20" fill="#ddd6fe" fill-opacity=".22"/>
    <path d="M32 40c6-14 12 14 20 0M32 33c6-14 12 14 20 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="80" y="33" class="ai-title">AI LAYER</text>
    <text x="80" y="54" class="ai-text">LLM APIs · Agents · Tool calling · MCP · Workflow automation</text>
    <text x="822" y="45" text-anchor="end" class="ai-text">applies across the product</text>
  </g>

  <path d="M192 203V234M480 203V234M768 203V234" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5 6"/>
  <path d="M315 306H357M603 306H645" stroke="url(#flow)" stroke-width="3" filter="url(#glow)"/>
  <path d="M347 297l12 9-12 9M635 297l12 9-12 9" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(48 234)">
    <rect width="267" height="126" rx="16" fill="#0f1d35" stroke="#2563eb"/>
    <circle cx="32" cy="32" r="16" fill="#1d4ed8"/>
    <path d="M24 28h16v9H24zM29 41h6" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="37" class="card-title">Frontend</text>
    <text x="24" y="72" class="tech">React · Next.js · TypeScript</text>
    <text x="24" y="99" class="detail">Responsive UI · Product experience</text>
  </g>
  <g transform="translate(357 234)">
    <rect width="246" height="126" rx="16" fill="#0f1d35" stroke="#0ea5e9"/>
    <circle cx="32" cy="32" r="16" fill="#0369a1"/>
    <path d="M24 32h16M32 24v16" stroke="#e0f2fe" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="5" fill="#0369a1" stroke="#e0f2fe" stroke-width="2"/>
    <text x="60" y="37" class="card-title">Backend</text>
    <text x="24" y="72" class="tech">Node.js · NestJS · Express</text>
    <text x="24" y="99" class="detail">APIs · Auth · Jobs · Business logic</text>
  </g>
  <g transform="translate(645 234)">
    <rect width="267" height="126" rx="16" fill="#0f1d35" stroke="#14b8a6"/>
    <circle cx="32" cy="32" r="16" fill="#0f766e"/>
    <ellipse cx="32" cy="27" rx="8" ry="3.5" fill="none" stroke="#e0f2fe" stroke-width="2"/>
    <path d="M24 27v10c0 4.5 16 4.5 16 0V27" fill="none" stroke="#e0f2fe" stroke-width="2"/>
    <text x="60" y="37" class="card-title">Data &amp; Delivery</text>
    <text x="24" y="72" class="tech">MongoDB · PostgreSQL · Redis</text>
    <text x="24" y="99" class="detail">Docker · Nginx · Deployable systems</text>
  </g>
</svg>
